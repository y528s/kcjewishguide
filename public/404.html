<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect
      // Stores the current path in sessionStorage and redirects to the app root.
      // The index.html restoration script picks it up and restores the URL.
      var pathSegmentsToKeep = 1; // 1 for project pages (y528s.github.io/kcjewishguide)
      var l = window.location;
      sessionStorage.redirect =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        l.pathname
          .split("/")
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/") +
        "/?/" +
        l.pathname
          .split("/")
          .slice(1 + pathSegmentsToKeep)
          .join("/")
          .replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash;
      l.replace(sessionStorage.redirect);
    </script>
  </head>
  <body></body>
</html>
